[project]
name = "mcp-adapter-example"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["tomli-w"]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
update-mcp-servers = "update_mcp_servers:main"

[tool.pytest.ini_options]
testpaths = [".ai/scripts"]
pythonpath = [".ai/scripts"]
